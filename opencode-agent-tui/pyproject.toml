[project]
name = "opencode-agent-tui"
version = "0.1.0"
description = "Terminal agent configuration editor for OpenCode"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
opencode-agent-tui = "opencode_agent_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
